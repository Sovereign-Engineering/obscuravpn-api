[package]
name = "obscuravpn-api"
version = "0.0.0"
edition = "2021"

description = "API client for Obscura VPN."
homepage = "https://github.com/Sovereign-Engineering/obscuravpn-api"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Sovereign-Engineering/obscuravpn-api"

[dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
derive_more = {  version = "2.0.1", features = ["full"] }
http = { version = "1.3.1" }
ipnetwork = { version =  "0.21.1", features = ["serde"] }
itertools = "0.14.0"
rand = { version = "0.8.5"}
reqwest = { version = "0.12.19", default-features = false, features = ["json", "rustls-tls-webpki-roots"], optional = true }
rustls = { version = "0.23.27", optional = true , default-features = false, features = ["ring", "logging", "std", "tls12"]}
semver = "1.0.26"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_with = { version = "3.12.0", features = ["base64"] }
static_assertions = "1.1.0"
strum = { version = "0.27.1", features = ["derive"] }
thiserror = "2.0.12"
tokio = { version = "1.45.1", default-features = false, features = ["net"] }
tracing = "0.1.41"
url = "2.5.4"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
webpki-roots = { version = "1.0.0", optional = true }

[features]
default = ["client"]
client = ["reqwest", "rustls", "webpki-roots"]
server = []

[dev-dependencies]
clap = { version = "4.5.39", features = ["derive"] }
env_logger = "0.11.8"
qrcode = "0.14.1"
tokio = { version = "1.45.1", features = ["full"] }
verhoeff = "1.0.0"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
