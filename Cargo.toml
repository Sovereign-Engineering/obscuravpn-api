[package]
name = "obscuravpn-api"
version = "1.0.0"
edition = "2021"

description = "API client for Obscura VPN."
homepage = "https://github.com/Sovereign-Engineering/obscuravpn-api"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Sovereign-Engineering/obscuravpn-api"

[dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
bytes = "1.10.1"
derive_more = {  version = "2.0.1", features = ["full"] }
http = { version = "1.3.1" }
ipnetwork = { version =  "0.21.1", features = ["serde"] }
itertools = "0.14.0"
rand = { version = "0.8.5"}
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "stream"], optional = true }
rustls = { version = "0.23.27", optional = true }
semver = "1.0.26"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_with = { version = "3.12.0", features = ["base64"] }
static_assertions = "1.1.0"
strum = { version = "0.27.1", features = ["derive"] }
thiserror = "2.0.12"
tokio = { version = "1.45.1", default-features = false, features = ["net"] }
tokio-stream = "0.1.17"
tracing = "0.1.41"
url = "2.5.4"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
webpki-roots = { version = "1.0.0", optional = true }
x509-parser = "0.17.0"

[features]
default = ["client"]
client = ["reqwest", "rustls", "webpki-roots"]
server = []

[dev-dependencies]
clap = { version = "4.5.39", features = ["derive"] }
qrcode = "0.14.1"
tracing-subscriber = "0.3.19"
tokio = { version = "1.45.1", features = ["full"] }
verhoeff = "1.0.0"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
