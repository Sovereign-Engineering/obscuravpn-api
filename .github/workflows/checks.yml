name: Checks

on:
  push: {}
  workflow_dispatch:

jobs:
  build_all:
    name: Build All
    runs-on: [nix]
    steps:
      - name: git checkout
        uses: actions/checkout@v4

      - name: Build Nix
        shell: bash
        run: |
          nix flake check \
            --keep-going \
            --no-update-lock-file \
            --print-build-logs \
            --show-trace
