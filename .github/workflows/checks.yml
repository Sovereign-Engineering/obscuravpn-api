name: Checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - 'v0'

jobs:
  build_all:
    name: Build All
    runs-on:
      - nscloud-ubuntu-20.04-amd64-2x32-with-cache
      - nscloud-cache-tag-obscuravpn-api
      - nscloud-cache-size-20gb
    steps:
      - name: git checkout
        uses: actions/checkout@v4

      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: /nix

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build Nix
        shell: bash
        run: |
          nix flake check \
            --experimental-features "flakes nix-command" \
            --keep-going \
            --no-update-lock-file \
            --print-build-logs \
            --show-trace
